name: Gerar APK do QrPix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto Android
        run: |
          unzip -q QrPix-Android-WebView.zip -d projeto
          cp -r projeto/* .
          cp -r projeto/.[!.]* . 2>/dev/null || true

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Compilar APK
        run: |
          gradle :app:assembleRelease

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: QrPix-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
  
